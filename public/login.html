<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WePay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="/vendor/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>
  <style>
    /* Estilos da Tela de Login - Tema Branco Puro */
    body {
      background-color: #fbfbfc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .login-card {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.04);
      text-align: left;
    }

    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #111827;
      text-align: center;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 0.85rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 28px;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      font-size: 0.775rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
    }

    .login-footer-info {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed var(--border);
      font-size: 0.775rem;
      color: #6b7280;
      text-align: center;
      line-height: 1.5;
    }

    .code-chip {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #111827;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="/" style="display: inline-flex; align-items: center; gap: 6px; color: #6b7280; font-size: 0.825rem; font-weight: 600; text-decoration: none; margin-bottom: 16px;">
      <i data-lucide="arrow-left" style="width: 15px; height: 15px;"></i>
      <span>Voltar ao Checkout</span>
    </a>

    <div class="login-card">
      
      <!-- Marca WePay -->
      <div class="login-brand">
        <span class="brand-icon"></span>
        <span class="brand-name" style="font-size: 1.25rem;">WePay</span>
      </div>

      <h1 class="login-title">Aceder ao Painel Admin</h1>
      <p class="login-sub">Introduza as suas credenciais para gerir cobranças e infoprodutos</p>

      <!-- Alerta de Erro -->
      <div id="loginError" class="clean-error" style="display: none; margin-bottom: 20px; align-items: center; gap: 8px;">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span id="loginErrorText">E-mail ou palavra-passe incorretos.</span>
      </div>

      <!-- Formulário de Login -->
      <form id="loginForm" novalidate>
        <div class="field-group">
          <label class="field-label" for="loginEmail">E-mail de Administrador</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="phone-input" 
            style="padding-left: 14px; padding-right: 14px;" 
            placeholder="admin@wepay.co.mz" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="field-group">
          <label class="field-label" for="loginPassword">Palavra-passe</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              class="phone-input" 
              style="padding-left: 14px; padding-right: 48px;" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="btnTogglePassword" class="btn-toggle-pwd" title="Mostrar / Ocultar" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;">
              <i data-lucide="eye" id="eyeIcon" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmitLogin" class="btn-pay" style="margin-top: 10px;">
          <span class="btn-text" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
            <span>Iniciar Sessão</span>
            <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
          </span>
          <div class="btn-spinner" style="display: none; margin: 0 auto;"></div>
        </button>
      </form>

      <!-- Dica de Credenciais Padrão com Preenchimento Automático -->
      <div class="login-footer-info">
        <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 6px;">
          <i data-lucide="shield-check" style="width: 14px; height: 14px; color: #16a34a;"></i>
          <span>Credenciais do Administrador:</span>
        </div>
        <div style="margin-bottom: 8px;">
          <span class="code-chip">admin@wepay.co.mz</span> / <span class="code-chip">admin123</span>
        </div>
        <button type="button" id="btnFillDemo" style="background: none; border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; font-size: 0.725rem; font-weight: 600; color: #4b5563; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: background 0.15s;">
          <i data-lucide="sparkles" style="width: 12px; height: 12px; color: #111827;"></i>
          <span>Preencher credenciais</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const btnSubmitLogin = document.getElementById('btnSubmitLogin');
    const btnText = btnSubmitLogin.querySelector('.btn-text');
    const btnSpinner = btnSubmitLogin.querySelector('.btn-spinner');
    const loginError = document.getElementById('loginError');
    const loginErrorText = document.getElementById('loginErrorText');
    const btnTogglePassword = document.getElementById('btnTogglePassword');

    // Alternar visibilidade da senha com ícone Lucide
    btnTogglePassword.addEventListener('click', () => {
      const isPwd = loginPassword.type === 'password';
      loginPassword.type = isPwd ? 'text' : 'password';
      btnTogglePassword.innerHTML = `<i data-lucide="${isPwd ? 'eye-off' : 'eye'}" style="width: 16px; height: 16px;"></i>`;
      if (window.lucide) lucide.createIcons({ root: btnTogglePassword });
    });

    if (window.lucide) lucide.createIcons();

    // Preenchimento rápido com 1 clique
    document.getElementById('btnFillDemo').addEventListener('click', () => {
      loginEmail.value = 'admin@wepay.co.mz';
      loginPassword.value = 'admin123';
      loginEmail.focus();
    });

    // Se já estiver logado, redireciona direto para o /admin
    async function checkAuth() {
      const savedToken = localStorage.getItem('wepay_auth_token') || sessionStorage.getItem('wepay_auth_token');
      if (!savedToken) return;
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${savedToken}` }
        });
        if (res.ok) {
          window.location.replace('/admin');
        }
      } catch (e) {
        // não logado
      }
    }
    checkAuth();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.style.display = 'none';

      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      if (!email || !password) {
        loginErrorText.textContent = 'Por favor, preencha o e-mail e a palavra-passe.';
        loginError.style.display = 'flex';
        return;
      }

      btnSubmitLogin.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Armazena token persistente e redireciona
          if (data.token) {
            localStorage.setItem('wepay_auth_token', data.token);
            sessionStorage.setItem('wepay_auth_token', data.token);
          }
          window.location.href = '/admin';
        } else {
          loginErrorText.textContent = data.error?.message || 'E-mail ou palavra-passe incorretos.';
          loginError.style.display = 'flex';
          loginPassword.value = '';
          loginPassword.focus();
        }
      } catch (err) {
        loginErrorText.textContent = 'Erro ao comunicar com o servidor. Tente novamente.';
        loginError.style.display = 'flex';
      } finally {
        btnSubmitLogin.disabled = false;
        btnText.style.display = 'inline-flex';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
